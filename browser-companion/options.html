<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusInbox 学习通网页同步</title><link rel="stylesheet" href="options.css"><body><main><h1>学习通网页同步</h1><p>同步学习通课程通知、聊天文字及已打开的作业/考试中心条目，无需手机伴侣。</p><form id="config"><label>网页同步令牌<input id="token" type="password" autocomplete="off" required placeholder="从 CampusInbox 学习通同步页复制"></label><label class="toggle"><input id="enabled" type="checkbox">启用学习通网页同步</label><label class="toggle"><input id="readInstructions" type="checkbox" checked>读取任务说明附件</label><button type="submit">保存配置</button><button id="retry" type="button">立即重试</button></form><p id="notice" role="status"></p><dl><dt>本机地址</dt><dd>http://127.0.0.1:8765</dd><dt>待传消息</dt><dd id="pending">0</dd><dt>格式待处理</dt><dd id="rejected">0</dd><dt>附件待重试</dt><dd id="incomplete">0</dd><dt>确认发送次数</dt><dd id="delivered">0</dd><dt>最近成功</dt><dd id="lastSuccess">尚无</dd><dt>最近状态</dt><dd id="lastError">未启用</dd></dl><p class="help">课程通知约每分钟检查；作业/考试中心读取当前页面已经显示并带官方链接的条目。DOCX 和说明类文本附件会尝试提取文字。平台状态只作为证据，不会自动标记本地任务已提交。不会导出 Cookie、密码或发送平台消息。</p></main><script src="options.js"></script></body></html>
