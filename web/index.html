<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#245b48"><title>CampusInbox · 校园智能任务Agent</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/evaluation.css"><script src="/evaluation.js" defer></script><script src="/app.js" defer></script></head>
<body>
<aside class="sidebar">
  <a class="brand" href="#today"><span class="brand-symbol">CI<span>·</span></span><span><strong>CampusInbox</strong><small>校园智能任务Agent</small></span></a>
  <div class="workspace-chip"><span class="avatar">我</span><div>我的学习空间</div><span class="local-dot"></span></div>
  <p class="nav-label">学习工作台</p>
  <nav aria-label="工作台导航">
    <button data-view="today" class="nav-item active"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span>今日概览</button>
    <button data-view="tasks" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m8 4 1-1h6l1 1h3v17H5V4Z"/><path d="M9 3v4h6V3M8 13l2 2 5-5M13 18h3"/></svg></span>待办任务<span id="taskBadge" class="nav-badge">0</span></button>
    <button data-view="inbox" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m4 5-2 9v6h20v-6l-2-9ZM2 14h6l2 3h4l2-3h6M8 5h8M8 9h8"/></svg></span>消息收件箱<span id="inboxBadge" class="nav-badge">0</span></button>
    <button data-view="calendar" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 11h18M8 15h2M14 15h2M8 18h2"/></svg></span>截止日历</button>
  </nav>
  <p class="nav-label second-label">连接与工具</p>
  <nav aria-label="连接与工具"><button data-view="sync" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 10a8 8 0 0 0-14-5L3 8m0-5v5h5M4 14a8 8 0 0 0 14 5l3-3m0 5v-5h-5"/></svg></span>学习通同步</button><button data-view="mobile" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 5h4M11 18h2"/></svg></span>手机连接</button><button data-view="evaluation" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 3v17h17M8 15v-4M13 15V6M18 15V9"/></svg></span>识别评测</button><button id="assistantOpen" class="nav-item"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 2v4m-2-2h4"/></svg></span>课务助手</button></nav>
  <div class="sidebar-bottom"><div class="mode-caption"><span class="local-dot"></span><span id="modeName">本地规则模式</span><span class="version">v0.1</span></div><p id="modeHint" hidden>数据保存在这台电脑。<br>每个任务都能追溯到通知原文。</p></div>
</aside>
<div class="app-shell">
  <header class="topbar"><div class="breadcrumb">我的学习空间</div><div class="top-actions"><span class="sync-label"><span class="local-dot"></span>本地已连接</span><button id="refreshButton" class="button icon-button" title="刷新数据" aria-label="刷新数据">↻</button><button id="importOpen" class="button primary"><span>＋</span> 导入通知</button></div></header>
  <main id="content" aria-live="polite"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="statusConfirmDialog" class="dialog status-confirm-dialog" aria-labelledby="statusConfirmTitle" aria-describedby="statusConfirmText"><div class="dialog-heading"><h2 id="statusConfirmTitle">确认你要进行该操作吗？</h2><button type="button" class="close-button" data-close aria-label="关闭确认框">×</button></div><p id="statusConfirmText"></p><form method="dialog" class="dialog-actions"><button class="button" value="cancel" autofocus>返回</button><button class="button primary" value="confirm">确认</button></form></dialog>
<dialog id="importDialog" class="dialog import-dialog">
  <div class="dialog-heading"><div><h2>导入一条课程通知</h2></div><button class="close-button" data-close aria-label="关闭">×</button></div>
  <form id="importForm">
    <label class="file-zone" for="noticeFile"><span class="file-icon">↥</span><strong>选择截图或通知文件</strong><span>图片 / TXT / DOCX / PDF（支持扫描件）· 最大 8 MB</span><input id="noticeFile" type="file" accept=".png,.jpg,.jpeg,.bmp,.webp,.txt,.md,.docx,.pdf"></label>
    <p id="fileStatus" class="helper" role="status"></p>
    <label class="field">导入来源<select id="noticePlatform"><option value="manual">其他通知 / 学习通</option><option value="wechat">微信文本</option><option value="qq">QQ文本</option></select></label>
    <label class="field"><span class="notice-text-label">消息正文 <span class="helper" id="noticeFormatHelp">建议格式：课程名：任务内容，截止时间</span></span><textarea id="noticeText" rows="6" required aria-describedby="noticeFormatHelp"></textarea></label>
    <div class="form-grid"><label class="field" id="noticeSourceField">消息来源<input id="noticeSource" value="学习通" maxlength="120" required></label><label class="field">消息发布时间<input id="noticeTime" type="datetime-local" required><span class="helper" id="noticeTimeHelp">北京时间；“明天”等以此为准。</span></label><label class="field">课程（可选）<input id="noticeCourse" placeholder="留空时从原文识别" maxlength="100"></label><label class="field"><span id="noticeScopeLabel">班级 / 分组（可选）</span><input id="noticeScope" placeholder="例如：计科 1 班" maxlength="100"></label><label class="field" id="noticeSenderField" hidden>发件人（可选）<input id="noticeSender" maxlength="100" placeholder="原消息中的姓名或昵称"></label></div>
    <label class="field">提取方式<select id="noticeMode"><option value="rules">本地规则提取</option><option value="agent">规则 + 模型辅助</option></select></label>
    <p id="importError" class="error-text" role="alert"></p><div class="dialog-actions"><button type="button" class="button" data-close>取消</button><button id="importSubmit" class="button primary" type="submit">提取任务草稿 →</button></div>
  </form>
</dialog>
<dialog id="messageDialog" class="dialog" aria-labelledby="messageDetailTitle"><div class="dialog-heading"><div><h2 id="messageDetailTitle">消息详情</h2></div><button class="close-button" data-close aria-label="关闭消息详情">×</button></div><div id="messageDetail"></div></dialog>
<dialog id="supplementDialog" class="dialog" aria-labelledby="supplementTitle">
  <div class="dialog-heading"><div><h2 id="supplementTitle">补充详情</h2><p>确认草稿后更新任务，原通知保留。</p></div><button class="close-button" data-close aria-label="关闭补充详情">×</button></div>
  <form id="supplementForm">
    <label class="field">对应任务<select id="supplementTarget" required></select></label>
    <label class="field">补充正文<textarea id="supplementText" rows="7" maxlength="20000" required placeholder="填写或粘贴任务要求、截止时间或提交方式。"></textarea></label>
    <details id="supplementTimeOptions" class="evidence"><summary>通知时间依据</summary><label class="field">原通知时间（北京时间）<input id="supplementReference" type="datetime-local"><span class="helper">仅推算相对日期时需要。</span></label></details>
    <p id="supplementError" class="error-text" role="alert"></p>
    <div class="dialog-actions"><button type="button" class="button" data-close>取消</button><button id="supplementSubmit" class="button primary" type="submit">生成待确认草稿</button></div>
  </form>
</dialog>
<dialog id="taskDialog" class="dialog"><div class="dialog-heading"><div><h2 id="detailTitle">任务详情</h2></div><button class="close-button" data-close aria-label="关闭">×</button></div><div id="taskDetail"></div></dialog>
<dialog id="assistantDialog" class="dialog"><div class="dialog-heading"><div><h2>课务助手</h2><p id="assistantMode">本地规则查询</p></div><button class="close-button" data-close aria-label="关闭">×</button></div><form id="assistantForm"><div class="form-grid"><label class="field">课程范围<input id="assistantCourse" placeholder="留空查询全部课程"></label><label class="field">班级范围<input id="assistantScope" placeholder="留空查询全部班级"></label></div><label class="field">你的问题<textarea id="assistantQuestion" rows="3" required placeholder="例如：下周有哪些未提交任务？"></textarea></label><details class="evidence assistant-examples"><summary>查询示例</summary><div class="toolbar"><button type="button" class="button small" data-query-example="下周有哪些未提交任务？">下周有哪些未提交任务？</button><button type="button" class="button small" data-query-example="未来7天有多少项任务？">未来7天有多少项任务？</button><button type="button" class="button small" data-query-example="搜索“图像”相关任务">搜索“图像”相关任务</button><button type="button" class="button small" data-query-example="哪些任务没有截止时间？">哪些任务没有截止时间？</button></div></details><button id="assistantSubmit" class="button primary" type="submit">查询任务</button></form><div id="assistantAnswer" class="answer-panel" hidden></div><div id="assistantTrace"></div></dialog>
<dialog id="cleanupDialog" class="dialog" aria-labelledby="cleanupTitle"><div class="dialog-heading"><div><h2 id="cleanupTitle">清理消息</h2><p id="cleanupDescription"></p></div></div><p>任务、草稿及关联原文保留；其他消息正文将删除。</p><p class="helper">不影响学习通原消息，已清理内容不会因重复采集重新出现。</p><div class="toolbar"><button id="cleanupCancel" class="button">取消</button><button id="cleanupConfirmButton" class="button primary">确认清理</button></div></dialog>
<dialog id="authDialog" class="dialog"><div class="dialog-heading"><div><h2>连接你的 CampusInbox</h2><p>远程访问需要电脑端的访问令牌。</p></div></div><form id="authForm"><label class="field">访问令牌<input id="authToken" type="password" required autocomplete="off"></label><p id="authError" class="error-text"></p><button type="submit" class="button primary">连接</button></form></dialog>
</body></html>
